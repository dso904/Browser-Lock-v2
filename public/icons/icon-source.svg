<!-- 
  SVG Lock Icon for Browser Lock Extension
  This can be converted to PNG using an online converter or build tool
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Lock body -->
  <rect x="36" y="56" width="56" height="48" rx="8" fill="white"/>
  
  <!-- Lock shackle -->
  <path d="M 48 56 L 48 40 C 48 28 56 20 64 20 C 72 20 80 28 80 40 L 80 56" 
        fill="none" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round"/>
  
  <!-- Keyhole -->
  <circle cx="64" cy="76" r="8" fill="#6366f1"/>
  <rect x="60" y="76" width="8" height="16" rx="2" fill="#6366f1"/>
</svg>
